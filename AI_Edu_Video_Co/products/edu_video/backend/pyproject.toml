[tool.poetry]
name = "edu-video-backend"
version = "1.0.0"
description = "AI-powered educational video generation platform backend"
authors = ["EduVideo Team <dev@eduvideo.ai>"]
readme = "README.md"
packages = [{ include = ".", from = "." }]

# --------------------------------------------------------------------------- #
# Runtime dependencies                                                         #
# --------------------------------------------------------------------------- #

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# Web framework
fastapi            = "^0.115.0"
uvicorn            = { extras = ["standard"], version = "^0.32.0" }
gunicorn           = "^23.0.0"
python-multipart   = "^0.0.12"   # OAuth2 form data

# Async + HTTP
httpx              = "^0.27.0"
anyio              = "^4.6.0"

# Database — PostgreSQL + Redis
sqlalchemy         = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg            = "^0.30.0"
alembic            = "^1.13.3"
redis              = { extras = ["hiredis"], version = "^5.2.0" }

# Pydantic v2
pydantic           = "^2.9.0"
pydantic-settings  = "^2.6.0"
email-validator    = "^2.2.0"

# Auth
python-jose        = { extras = ["cryptography"], version = "^3.3.0" }
passlib            = { extras = ["bcrypt"], version = "^1.7.4" }

# LangChain + LLM providers
langchain          = "^0.3.7"
langchain-core     = "^0.3.15"
langchain-anthropic = "^0.3.0"
langchain-groq     = "^0.2.1"
langchain-openai   = "^0.2.9"    # text-embedding-3-small
langgraph          = "^0.2.45"
langgraph-checkpoint = "^2.0.4"
anthropic          = "^0.39.0"

# Vector DB
qdrant-client      = "^1.12.0"

# Google Cloud
google-cloud-texttospeech = "^2.17.2"
google-cloud-storage      = "^2.18.2"
google-auth               = "^2.36.0"

# Media processing (Layer 5 rendering)
ffmpeg-python      = "^0.2.0"
mutagen            = "^1.47.0"   # MP3 duration measurement
Pillow             = "^10.4.0"
matplotlib         = "^3.9.2"
pygments           = "^2.18.0"
cairosvg           = "^2.7.1"    # SVG → PNG for diagram renderer

# Manim — mathematical animations
manim              = "^0.18.1"

# Puppeteer — Lottie frame capture via headless Chromium
pyppeteer          = "^2.0.0"

# Billing
stripe             = "^11.1.0"

# RAG + NLP
rank-bm25          = "^0.2.2"
langdetect         = "^1.0.9"
pyyaml             = "^6.0.2"    # tier_limits.yaml + prompt configs

# Utilities
structlog          = "^24.4.0"
python-dateutil    = "^2.9.0"
python-dotenv      = "^1.0.1"
python-slugify     = "^8.0.4"
tenacity           = "^9.0.0"

# --------------------------------------------------------------------------- #
# Development dependencies                                                     #
# --------------------------------------------------------------------------- #

[tool.poetry.group.dev.dependencies]
pytest             = "^8.3.3"
pytest-asyncio     = "^0.24.0"
pytest-cov         = "^5.0.0"
httpx              = "^0.27.0"   # FastAPI TestClient
black              = "^24.10.0"
ruff               = "^0.7.4"
mypy               = "^1.13.0"
pre-commit         = "^4.0.1"
faker              = "^30.8.1"

[tool.poetry.group.test.dependencies]
pytest-mock        = "^3.14.0"
factory-boy        = "^3.3.1"

# --------------------------------------------------------------------------- #
# Build system                                                                 #
# --------------------------------------------------------------------------- #

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Tool configuration                                                           #
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = [
  "E501",   # line too long — handled by black
  "N805",   # first argument of method not named self (false positives with Pydantic)
  "B008",   # do not perform function call in default arguments (FastAPI Depends pattern)
  "UP007",  # use X | Y for union types — keep Optional for Pydantic v1 compat
]

[tool.ruff.lint.per-file-ignores]
"tests/*"  = ["S101"]  # assert allowed in tests
"main.py"  = ["E402"]  # module level import not at top (lifespan imports)

[tool.black]
line-length    = 100
target-version = ["py311"]

[tool.mypy]
python_version      = "3.11"
ignore_missing_imports = true
strict              = false
exclude             = ["tests/", "alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "--cov=. --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = [
  "tests/*",
  "alembic/*",
  "*/__init__.py",
]
