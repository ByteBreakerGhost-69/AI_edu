[project]
name = "edu-video-backend"
version = "0.1.0"
description = "AI-powered educational video generation backend for AI_Edu_Video_Co"
authors = [
    { name = "AI_Edu_Video_Co Team", email = "dev@ai-edu-video.co" }
]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "starlette>=0.41.0",

    # --- Auth & Security ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # --- Data Validation ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- Database: PostgreSQL ---
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",

    # --- Database: Redis ---
    "redis[hiredis]>=5.1.0",

    # --- Vector DB: Qdrant ---
    "qdrant-client>=1.12.0",

    # --- LLM: Claude (Anthropic) ---
    "anthropic>=0.40.0",

    # --- LLM: OpenAI-compatible (Grok / xAI) ---
    "openai>=1.54.0",

    # --- Agentic Orchestration ---
    "langgraph>=0.2.50",
    "langchain>=0.3.7",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.7",
    "langchain-community>=0.3.7",

    # --- RAG / Embeddings ---
    "sentence-transformers>=3.3.0",
    "tiktoken>=0.8.0",

    # --- HTTP Client ---
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",

    # --- Task Queue / Background Jobs ---
    "celery[redis]>=5.4.0",
    "kombu>=5.4.0",

    # --- TTS (layer5) ---
    "elevenlabs>=1.9.0",
    "boto3>=1.35.0",           # Amazon Polly fallback + S3/GCS bridge

    # --- Audio / Video Processing ---
    "ffmpeg-python>=0.2.0",
    "Pillow>=11.0.0",
    "numpy>=2.1.0",
    "imageio>=2.36.0",
    "av>=13.1.0",              # PyAV: frame-level audio/video ops

    # --- Animation: Manim ---
    "manim>=0.18.1",

    # --- Utilities ---
    "tenacity>=9.0.0",         # Retry logic
    "structlog>=24.4.0",       # Structured logging
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.0.1",
    "orjson>=3.10.0",          # Fast JSON
    "pendulum>=3.0.0",         # Datetime handling
    "ulid-py>=1.1.0",          # Job ID generation
    "rich>=13.9.0",            # CLI output
]

[project.optional-dependencies]
dev = [
    # --- Testing ---
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",           # TestClient for FastAPI
    "factory-boy>=3.3.1",
    "faker>=30.0.0",

    # --- Linting & Formatting ---
    "ruff>=0.7.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "mypy>=1.13.0",

    # --- Type Stubs ---
    "types-redis>=4.6.0",
    "types-Pillow>=10.2.0",
    "sqlalchemy[mypy]>=2.0.36",

    # --- Pre-commit ---
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "models",
    "layer1_input",
    "layer2_orchestrator",
    "layer3_rag",
    "layer4_script_visual",
    "layer5_rendering",
    "layer6_delivery",
    "workers",
    "utils",
    "prompts",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "core",
    "models",
    "layer1_input",
    "layer2_orchestrator",
    "layer3_rag",
    "layer4_script_visual",
    "layer5_rendering",
    "layer6_delivery",
    "workers",
    "utils",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]
exclude = [".venv", "migrations", "__pycache__"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = [
    "manim.*",
    "ffmpeg.*",
    "av.*",
    "celery.*",
    "kombu.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=. --cov-report=term-missing --cov-report=html -v"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "migrations/*",
    ".venv/*",
    "__pycache__/*",
]
